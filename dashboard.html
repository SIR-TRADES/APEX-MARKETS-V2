<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061b2e">
  <title>Dashboard | APEX CAPITAL</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="dashboard" id="dashboard">
      <aside class="sidebar">
        <div class="brand-mark"><span>APEX</span><small>CAPITAL</small></div>
        <nav>
          <p class="nav-label">MAIN MENU</p>
          <button class="nav-item active" data-view="overview"><span class="nav-icon">/</span> Overview</button>
          <button class="nav-item client-only" data-view="markets"><span class="nav-icon">~</span> Markets</button>
          <button class="nav-item" data-view="activity"><span class="nav-icon">=</span> Activity</button>
          <p class="nav-label nav-spacer">ACCOUNT</p>
          <button class="nav-item" data-view="settings"><span class="nav-icon">o</span> Settings</button>
          <button class="nav-item admin-only" data-view="admin"><span class="nav-icon">#</span> Admin panel</button>
        </nav>
        <div class="sidebar-bottom"><div class="profile-mini"><span class="avatar" id="sidebarAvatar">AM</span><span><strong id="sidebarName">Alex Morgan</strong><small>Personal account</small></span><b>...</b></div><button class="logout-button" id="logoutButton">Log out</button></div>
      </aside>
      <div class="dashboard-main">
        <header class="topbar"><div><p class="eyebrow">WEDNESDAY, 16 SEPTEMBER 2026</p><h2 id="pageTitle">Good morning, Alex <span>~</span></h2></div><div class="top-actions"><button class="icon-button" id="notificationButton" title="Notifications">o<span class="notification-dot"></span></button><button class="profile-chip"><span class="avatar" id="topAvatar">AM</span><span id="topName">Alex Morgan</span><b>v</b></button></div></header>
        <div id="viewContent"></div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
